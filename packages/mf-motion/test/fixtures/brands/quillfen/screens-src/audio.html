<style>
.player { display: grid; grid-template-columns: 420px 1fr; gap: 56px; padding: 44px 72px; height: 100%; align-items: start; }
.art { aspect-ratio: 1; background: var(--accent2); border-radius: 4px; position: relative; overflow: hidden; box-shadow: 0 18px 40px rgba(20, 20, 20, 0.18); }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.now { display: flex; flex-direction: column; gap: 16px; }
.now h1 { font-size: 44px; line-height: 1.05; }
.now .reader { font-size: 18px; }
.wave { display: flex; align-items: center; gap: 3px; height: 70px; margin-top: 10px; }
.wave i { flex: 1; border-radius: 2px; background: var(--line); }
.wave i.on { background: var(--accent); }
.times { display: flex; justify-content: space-between; font-family: "Inter", sans-serif; font-size: 12px; color: var(--muted); }
.controls { display: flex; align-items: center; gap: 22px; margin-top: 6px; }
.controls .play { width: 64px; height: 64px; border-radius: 32px; background: var(--accent); display: grid; place-items: center; }
.controls .skip { font-family: "Inter", sans-serif; font-weight: 600; font-size: 13px; color: var(--ink); }
.controls .speed { margin-left: auto; font-family: "Inter", sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.06em; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 4px; }
.chapters { margin-top: 10px; }
.chapters .ch { display: grid; grid-template-columns: 60px 1fr 60px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.chapters .ch span:first-child, .chapters .ch span:last-child { font-family: "Inter", sans-serif; font-size: 12px; color: var(--muted); padding-top: 3px; }
.chapters .ch span:last-child { text-align: right; }
.chapters .ch.on { color: var(--accent); }
@media (max-width: 600px) {
  .player { grid-template-columns: 1fr; padding: 18px 22px; gap: 18px; }
  .art { width: 100%; max-height: 300px; aspect-ratio: auto; height: 300px; }
  .now h1 { font-size: 28px; }
  .wave { height: 48px; }
  .chapters { display: none; }
}
</style>
