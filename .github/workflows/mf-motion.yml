name: mf-motion

on:
  push:
    paths:
      - 'skills/mf-motion/**'
      - 'packages/mf-motion/**'
      - '.github/workflows/mf-motion.yml'
  pull_request:
    paths:
      - 'skills/mf-motion/**'
      - 'packages/mf-motion/**'
      - '.github/workflows/mf-motion.yml'

permissions:
  contents: read

concurrency:
  group: mf-motion-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MF_MOTION_CACHE: ${{ github.workspace }}/.cache/mf-motion
  MF_MOTION_HOME: ${{ github.workspace }}/.cache/mf-motion-home
  npm_config_cache: ${{ github.workspace }}/.cache/npm

jobs:
  unit:
    name: unit + integration (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [24]
        include:
          - os: ubuntu-24.04
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('packages/mf-motion/package-lock.json') }}
      - name: Install FFmpeg (users install it themselves; doctor prints the line)
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - name: Allow Chrome's sandbox on Ubuntu 24.04 (unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm --prefix packages/mf-motion ci
      - run: npm --prefix packages/mf-motion run typecheck
      - run: npm --prefix packages/mf-motion run build
      - run: npm --prefix packages/mf-motion run test:unit

  render:
    name: render, serial (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('packages/mf-motion/package-lock.json') }}
      - name: Install FFmpeg (users install it themselves; doctor prints the line)
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - name: Allow Chrome's sandbox on Ubuntu 24.04 (unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm --prefix packages/mf-motion ci
      - run: npm --prefix packages/mf-motion run build
      - run: npm --prefix packages/mf-motion run test:render

  synth-identity:
    name: synth identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('packages/mf-motion/package-lock.json') }}
      - run: npm --prefix packages/mf-motion ci
      - name: Render the three fixture grids and record score-raw.wav hashes
        run: npm --prefix packages/mf-motion run test:unit -- test/unit/sound/synth -t "renders the same grid"
        env:
          MFM_SYNTH_HASHES: ${{ github.workspace }}/synth-hashes-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: synth-hashes-${{ matrix.os }}
          path: synth-hashes-${{ matrix.os }}.json

  synth-identity-compare:
    name: synth identity, all OSes agree
    needs: synth-identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synth-hashes-*
          merge-multiple: true
      - name: Compare hashes
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter((f) => /^synth-hashes-.*\.json$/.test(f)).sort();
            if (files.length !== 3) { console.error("expected 3 hash files, found " + files.length); process.exit(1); }
            const all = files.map((f) => [f, JSON.parse(fs.readFileSync(f, "utf8"))]);
            for (const [f, h] of all) console.log(f, JSON.stringify(h));
            const first = JSON.stringify(all[0][1]);
            const differ = all.filter(([, h]) => JSON.stringify(h) !== first).map(([f]) => f);
            if (differ.length > 0) { console.error("score-raw.wav differs across OSes: " + differ.join(", ")); process.exit(1); }
            console.log("all OSes agree");
          '

  pack-check:
    name: pack check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('packages/mf-motion/package-lock.json') }}
      - run: npm --prefix packages/mf-motion ci
      - run: npm --prefix packages/mf-motion run build
      - run: npm --prefix packages/mf-motion run pack:check

  licence-denylist:
    name: licence denylist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm --prefix packages/mf-motion run licence:check

  bare-container-doctor:
    name: bare container doctor (debian bookworm-slim, Node 24 only)
    runs-on: ubuntu-24.04
    container: node:24-bookworm-slim
    env:
      # The mounted workspace belongs to the host runner account, which the
      # engine treats as another owner; keep its cache inside the container.
      MF_MOTION_CACHE: /root/.cache/mf-motion
      MF_MOTION_HOME: /root/mf-motion
    steps:
      - uses: actions/checkout@v5
      - run: npm --prefix packages/mf-motion ci
      - run: npm --prefix packages/mf-motion run build
      - run: mkdir -p "$GITHUB_WORKSPACE/.cache" && npm pack ./packages/mf-motion --pack-destination "$GITHUB_WORKSPACE/.cache"
      - name: doctor --fix lists FFmpeg and the Chrome libraries as missing, with apt lines
        run: |
          set +e
          node packages/mf-motion/dist/cli.mjs doctor --fix --json --cli-tarball .cache/mf-motion-1.0.0.tgz > .cache/doctor-1.json
          code=$?
          set -e
          test "$code" = 1
          node -e '
            const d = require("./.cache/doctor-1.json").data;
            const row = (id) => d.checks.find((c) => c.id === id);
            for (const id of ["ffmpeg", "chrome"]) {
              if (row(id).status !== "missing" || !/apt-get install/.test(row(id).fix)) throw new Error(id + " row: " + JSON.stringify(row(id)));
            }
            const lines = [...new Set(d.checks.filter((c) => c.status === "missing" && /apt-get install/.test(c.fix ?? "")).map((c) => c.fix))];
            require("fs").writeFileSync(".cache/fix-lines.sh", "apt-get update\n" + lines.map((l) => l.replace(/sudo /g, "")).join("\n") + "\n");
          '
          cat .cache/fix-lines.sh
      - name: Run the printed fix lines (root in the container, so without sudo)
        run: sh .cache/fix-lines.sh
      - name: doctor --fix now exits 0
        run: node packages/mf-motion/dist/cli.mjs doctor --fix --json --cli-tarball .cache/mf-motion-1.0.0.tgz

  offline-smoke:
    name: offline smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm --prefix packages/mf-motion ci
      - run: npm --prefix packages/mf-motion run build
      - run: mkdir -p "$GITHUB_WORKSPACE/.cache" && npm pack ./packages/mf-motion --pack-destination "$GITHUB_WORKSPACE/.cache"
      - run: node packages/mf-motion/dist/cli.mjs doctor --fix --json --cli-tarball .cache/mf-motion-1.0.0.tgz
      - name: Without a network, doctor --offline exits 0 and its launcher runs version
        # A network namespace without links; the commands run as the runner user,
        # not a mapped root, so the cache keeps its real owners.
        run: |
          cat > .cache/offline.sh <<'EOF2'
          set -e
          if node -e 'require("https").get("https://registry.npmjs.org", () => process.exit(0)).on("error", () => process.exit(1))'; then
            echo "network is reachable inside the namespace" >&2; exit 1
          fi
          node packages/mf-motion/dist/cli.mjs doctor --offline --json > .cache/doctor-offline.json
          node -e '
            const { execFileSync } = require("child_process");
            const d = require("./.cache/doctor-offline.json").data;
            if (!d.ok) throw new Error("doctor --offline not ok");
            const out = JSON.parse(execFileSync(d.launcher[0], [...d.launcher.slice(1), "version", "--json"]).toString());
            if (out.data.cli !== "1.0.0") throw new Error("launcher version " + out.data.cli);
          '
          EOF2
          sudo --preserve-env unshare --net -- sudo --preserve-env -u "$USER" env "PATH=$PATH" bash .cache/offline.sh

